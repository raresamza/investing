[project]
name = "stock-analyst-ai"
version = "0.1.0"
description = "Long-term stock market analyst — scores equities and produces HOLD/SELL/REBUY/BUY recommendations"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-ta>=0.3.14b1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "optuna>=3.6",
    "joblib>=1.4",
    "pyarrow>=17.0",
    "pyportfolioopt>=1.5.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "rich>=13.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
analyst = "src.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
